<section class="login-shell">
  <div class="login-page">
    <div class="login-page__visual"></div>

    <div class="login-page__panel">
      <div class="login-page__language">
        <app-language-switcher></app-language-switcher>
      </div>

      <div class="login-page__content">
        <header class="login-page__header">
          <h1 class="login-page__title">{{ 'AUTH.LOGIN.TITLE' | translate }}</h1>
          <p class="login-page__subtitle">{{ 'AUTH.LOGIN.SUBTITLE' | translate }}</p>
        </header>

        <form class="login-form" [formGroup]="form" (ngSubmit)="submit()">
          <label class="login-form__field" for="email">
            <span class="login-form__label">{{ 'AUTH.FIELDS.EMAIL' | translate }}</span>
            <span class="login-form__input-wrap">
              <input
                id="email"
                type="email"
                formControlName="email"
                autocomplete="email"
                [attr.placeholder]="'AUTH.FIELDS.EMAIL_PLACEHOLDER' | translate"
              />
            </span>
          </label>

          <p class="login-form__message login-form__message--error" *ngIf="submitted && form.controls.email.invalid">
            {{ 'AUTH.VALIDATION.EMAIL' | translate }}
          </p>

          <label class="login-form__field" for="password">
            <span class="login-form__label">{{ 'AUTH.FIELDS.PASSWORD' | translate }}</span>
            <span class="login-form__input-wrap">
              <input
                id="password"
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                autocomplete="current-password"
                [attr.placeholder]="'AUTH.FIELDS.PASSWORD_PLACEHOLDER' | translate"
              />
              <button
                type="button"
                class="login-form__icon-button"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="'AUTH.REGISTER.TOGGLE_PASSWORD' | translate"
              >
                <img src="assets/icons/hidden.svg" alt="" />
              </button>
            </span>
          </label>

          <p class="login-form__message login-form__message--error" *ngIf="submitted && form.controls.password.invalid">
            {{ 'AUTH.VALIDATION.PASSWORD' | translate }}
          </p>

          <div class="login-form__actions">
            <button type="button" class="login-form__forgot-link" [disabled]="isSendingReset" (click)="requestPasswordReset()">
              {{ 'AUTH.LOGIN.FORGOT_PASSWORD' | translate }}
            </button>
          </div>

          <p class="login-form__message login-form__message--error" *ngIf="errorMessage">{{ errorMessage }}</p>

          <button type="submit" class="login-form__submit" [disabled]="isSubmitting">
            {{ (isSubmitting ? 'AUTH.LOGIN.SUBMITTING' : 'AUTH.LOGIN.SUBMIT') | translate }}
          </button>
        </form>

        <p class="login-page__register">
          <span>{{ 'AUTH.LOGIN.NEW_USER_PROMPT' | translate }}</span>
          <a routerLink="/register">{{ 'AUTH.LOGIN.REGISTER' | translate }}</a>
        </p>
      </div>
    </div>
  </div>
</section>
