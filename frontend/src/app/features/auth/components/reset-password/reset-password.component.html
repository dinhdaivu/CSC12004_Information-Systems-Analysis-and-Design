<section class="reset-shell">
  <div class="reset-page">
    <div class="reset-page__visual"></div>

    <div class="reset-page__panel">
      <div class="reset-page__language">
        <app-language-switcher></app-language-switcher>
      </div>

      <div class="reset-page__content">
        <header class="reset-page__header">
          <h1 class="reset-page__title">{{ 'AUTH.RESET_PASSWORD.TITLE' | translate }}</h1>
          <p class="reset-page__subtitle">{{ 'AUTH.RESET_PASSWORD.SUBTITLE' | translate }}</p>
        </header>

        <p class="reset-page__description">
          {{ 'AUTH.RESET_PASSWORD.DESCRIPTION' | translate }}
        </p>

        <form class="reset-form" [formGroup]="form" (ngSubmit)="submit()">
          <div class="reset-form__code-grid" formArrayName="code">
            <input
              *ngFor="let control of codeControls.controls; let index = index"
              #codeInput
              class="reset-form__code-input"
              type="text"
              inputmode="numeric"
              maxlength="1"
              autocomplete="one-time-code"
              [formControlName]="index"
              (input)="onDigitInput(index, $event)"
              (keydown)="onKeyDown(index, $event)"
            />
          </div>

          <div class="reset-form__passwords">
            <label class="reset-form__field" for="reset-password">
              <span class="reset-form__label">{{ 'AUTH.FIELDS.PASSWORD' | translate }}</span>
              <span class="reset-form__input-wrap">
                <input
                  id="reset-password"
                  [type]="showPassword ? 'text' : 'password'"
                  formControlName="password"
                  autocomplete="new-password"
                  [attr.placeholder]="'AUTH.FIELDS.PASSWORD_PLACEHOLDER' | translate"
                />
                <button
                  type="button"
                  class="reset-form__icon-button"
                  (click)="togglePasswordVisibility('password')"
                  [attr.aria-label]="'AUTH.REGISTER.TOGGLE_PASSWORD' | translate"
                >
                  <img src="assets/icons/hidden.svg" alt="" />
                </button>
              </span>
            </label>

            <label class="reset-form__field" for="reset-confirm-password">
              <span class="reset-form__label">{{ 'AUTH.REGISTER.CONFIRM_PASSWORD' | translate }}</span>
              <span class="reset-form__input-wrap">
                <input
                  id="reset-confirm-password"
                  [type]="showConfirmPassword ? 'text' : 'password'"
                  formControlName="confirm_password"
                  autocomplete="new-password"
                  [attr.placeholder]="'AUTH.REGISTER.CONFIRM_PASSWORD_PLACEHOLDER' | translate"
                />
                <button
                  type="button"
                  class="reset-form__icon-button"
                  (click)="togglePasswordVisibility('confirm_password')"
                  [attr.aria-label]="'AUTH.REGISTER.TOGGLE_CONFIRM_PASSWORD' | translate"
                >
                  <img src="assets/icons/hidden.svg" alt="" />
                </button>
              </span>
            </label>
          </div>

          <p class="reset-form__message reset-form__message--error" *ngIf="submitted && form.invalid">
            {{ 'AUTH.RESET_PASSWORD.VALIDATION' | translate }}
          </p>

          <p class="reset-form__message reset-form__message--error" *ngIf="errorMessage">{{ errorMessage }}</p>
          <p class="reset-form__message reset-form__message--success" *ngIf="successMessage">{{ successMessage }}</p>

          <button type="submit" class="reset-form__submit" [disabled]="isSubmitting">
            {{ (isSubmitting ? 'AUTH.RESET_PASSWORD.SUBMITTING' : 'AUTH.RESET_PASSWORD.SUBMIT') | translate }}
          </button>
        </form>

        <p class="reset-page__resend">
          <span>{{ 'AUTH.RESET_PASSWORD.RESEND_PROMPT' | translate }}</span>
          <button type="button" (click)="resendCode()" [disabled]="isResending">
            {{ (isResending ? 'AUTH.RESET_PASSWORD.RESENDING' : 'AUTH.RESET_PASSWORD.RESEND_ACTION') | translate }}
          </button>
        </p>

        <button type="button" class="reset-page__login-link" *ngIf="successMessage" (click)="goToLogin()">
          {{ 'AUTH.CONFIRM_EMAIL.LOGIN_ACTION' | translate }}
        </button>
      </div>
    </div>
  </div>
</section>
