name: Deploy to Railway

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      service:
        description: Which service to deploy
        type: choice
        required: true
        default: both
        options:
          - both
          - backend
          - frontend

concurrency:
  group: railway-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-backend:
    if: github.event_name == 'push' || github.event.inputs.service == 'both' || github.event.inputs.service == 'backend'
    name: Deploy backend
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy backend service
        working-directory: backend
        run: railway up --service "${{ vars.RAILWAY_BACKEND_SERVICE || 'backend' }}" --ci

  deploy-frontend:
    if: github.event_name == 'push' || github.event.inputs.service == 'both' || github.event.inputs.service == 'frontend'
    name: Deploy frontend
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy frontend service
        working-directory: frontend
        run: railway up --service "${{ vars.RAILWAY_FRONTEND_SERVICE || 'frontend' }}" --ci
